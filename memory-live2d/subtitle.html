<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <title>Memory Suite - 字幕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #subtitle-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 1200px;
            min-width: 400px;
            max-height: 400px;
            padding: 20px 30px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
            text-align: center;
            overflow-y: hidden;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        #subtitle-text {
            color: white;
            font-size: 36px;
            margin: 0;
            font-family: 'Patrick Hand', 'ZCOOL QingKe HuangYou', sans-serif;
            line-height: 1.5;
            font-weight: 900;
            text-shadow: 
                -0.5px -0.5px 0 black,
                0.5px -0.5px 0 black,
                -0.5px 0.5px 0 black,
                1.5px 1.5px 0 black;
        }

        /* 可选：添加背景 */
        .with-background #subtitle-container {
            background: rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div id="subtitle-container">
        <p id="subtitle-text"></p>
    </div>

    <script>
        class SubtitleController {
            constructor() {
                this.subtitleElement = document.getElementById('subtitle-text');
                this.subtitleContainer = document.getElementById('subtitle-container');
                this.lastSubtitle = '';
                this.typingTimer = null;
                this.subtitleClearTimer = null;
                
                // 字体配置
                this.baseFontSize = 36;
                this.minFontSize = 30;
                this.fontScaleStep = 1.5;
                this.maxHeight = 400;
                this.maxWidth = 1200;
                this.charsPerLine = 20;
                
                // 服务器地址
                this.serverUrl = window.location.origin;
            }

            async init() {
                // 加载配置
                await this.loadConfig();
                
                // 开始轮询字幕
                this.startPolling();
                
                console.log('✅ 字幕控制器初始化完成');
            }

            async loadConfig() {
                try {
                    const response = await fetch(`${this.serverUrl}/api/config`);
                    if (response.ok) {
                        const config = await response.json();
                        console.log('📥 服务器返回的完整配置:', JSON.stringify(config, null, 2));
                        
                        if (config.subtitle) {
                            this.baseFontSize = parseInt(config.subtitle.baseFontSize) || 36;
                            this.minFontSize = parseInt(config.subtitle.minFontSize) || 30;
                            this.fontScaleStep = parseFloat(config.subtitle.fontScaleStep) || 1.5;
                            this.maxHeight = parseInt(config.subtitle.maxHeight) || 400;
                            this.maxWidth = parseInt(config.subtitle.maxWidth) || 1200;
                            this.charsPerLine = parseInt(config.subtitle.charsPerLine) || 20;
                            
                            this.subtitleElement.style.fontSize = this.baseFontSize + 'px';
                            this.subtitleContainer.style.maxHeight = this.maxHeight + 'px';
                            this.subtitleContainer.style.maxWidth = this.maxWidth + 'px';
                            
                            console.log('🔤 字幕配置已应用:', {
                                baseFontSize: this.baseFontSize,
                                minFontSize: this.minFontSize,
                                charsPerLine: this.charsPerLine,
                                maxHeight: this.maxHeight,
                                maxWidth: this.maxWidth
                            });
                        }
                    } else {
                        console.error('❌ 配置请求失败:', response.status);
                    }
                } catch (error) {
                    console.error('❌ 无法加载配置:', error);
                }
            }

            startPolling() {
                // 每 200ms 轮询一次
                setInterval(() => this.pollSubtitle(), 200);
            }

            async pollSubtitle() {
                try {
                    const response = await fetch(`${this.serverUrl}/api/audio/current`);
                    if (response.ok) {
                        const data = await response.json();

                        if (data.subtitle !== undefined && data.subtitle !== this.lastSubtitle) {
                            const oldSubtitle = this.lastSubtitle || '';
                            this.lastSubtitle = data.subtitle;

                            if (data.subtitle && data.subtitle.startsWith(oldSubtitle) && oldSubtitle.length > 0) {
                                // 追加新内容
                                const newPart = data.subtitle.substring(oldSubtitle.length);
                                this.typewriterAppend(newPart);
                            } else if (data.subtitle) {
                                // 全新字幕
                                this.typewriterShow(data.subtitle);
                            } else {
                                // 清空
                                this.clearSubtitle();
                            }

                            // 如果有 duration，设置自动清除
                            if (data.subtitleDuration && data.subtitleDuration > 0 && data.subtitle) {
                                this.scheduleSubtitleClear(data.subtitleDuration);
                            }
                        }
                    }
                } catch (error) {
                    // 静默忽略
                }
            }

            // 按每行最大字数插入换行
            wrapText(text) {
                if (!this.charsPerLine || this.charsPerLine <= 0) return text;
                
                const lines = [];
                let currentLine = '';
                
                for (const char of text) {
                    // 遇到已有换行符，保留
                    if (char === '\n') {
                        lines.push(currentLine);
                        currentLine = '';
                        continue;
                    }
                    
                    currentLine += char;
                    
                    // 达到每行最大字数，换行
                    if (currentLine.length >= this.charsPerLine) {
                        lines.push(currentLine);
                        currentLine = '';
                    }
                }
                
                // 剩余内容
                if (currentLine) {
                    lines.push(currentLine);
                }
                
                return lines.join('\n');
            }

            typewriterShow(text) {
                if (this.typingTimer) {
                    clearInterval(this.typingTimer);
                    this.typingTimer = null;
                }

                // 按字数换行
                const wrappedText = this.wrapText(text);
                
                this.subtitleContainer.style.display = 'block';
                let index = 0;
                this.subtitleElement.textContent = '';

                this.typingTimer = setInterval(() => {
                    if (index < wrappedText.length) {
                        this.subtitleElement.textContent += wrappedText[index];
                        index++;
                    } else {
                        clearInterval(this.typingTimer);
                        this.typingTimer = null;
                    }
                }, 50);
            }

            typewriterAppend(newText) {
                if (!newText) return;

                if (this.typingTimer) {
                    clearInterval(this.typingTimer);
                    this.typingTimer = null;
                }

                this.subtitleContainer.style.display = 'block';
                let index = 0;
                const currentText = this.subtitleElement.textContent;
                
                // 重新计算整体换行
                const fullText = this.lastSubtitle; // 已经包含新内容
                const wrappedFull = this.wrapText(fullText);

                this.typingTimer = setInterval(() => {
                    if (index < newText.length) {
                        // 逐字显示，但使用换行后的完整文本
                        const partialFull = fullText.substring(0, currentText.length + index + 1);
                        this.subtitleElement.textContent = this.wrapText(partialFull);
                        index++;
                    } else {
                        clearInterval(this.typingTimer);
                        this.typingTimer = null;
                    }
                }, 50);
            }

            clearSubtitle() {
                if (this.typingTimer) {
                    clearInterval(this.typingTimer);
                    this.typingTimer = null;
                }
                if (this.subtitleClearTimer) {
                    clearTimeout(this.subtitleClearTimer);
                    this.subtitleClearTimer = null;
                }
                this.subtitleElement.textContent = '';
                this.subtitleContainer.style.display = 'none';
                this.lastSubtitle = '';
            }

            scheduleSubtitleClear(durationMs) {
                if (this.subtitleClearTimer) {
                    clearTimeout(this.subtitleClearTimer);
                }

                this.subtitleClearTimer = setTimeout(() => {
                    this.clearSubtitle();
                }, durationMs);
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', async () => {
            const controller = new SubtitleController();
            await controller.init();
            window.subtitleController = controller;
        });

        // URL 参数控制
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('bg') === '1' || urlParams.get('background') === '1') {
            document.body.classList.add('with-background');
        }
    </script>
</body>
</html>
