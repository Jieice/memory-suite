<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Suite Admin</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: rgba(22, 27, 34, 0.95);
            --panel-border: rgba(48, 54, 61, 0.8);
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --ok: #3fb950;
            --warn: #d29922;
            --err: #f85149;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: var(--accent);
            text-align: center;
        }

        .section {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section h2 {
            margin: 0 0 16px;
            font-size: 16px;
            color: var(--ok);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section h2::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--ok);
            border-radius: 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(88, 166, 255, 0.2);
            border-color: var(--accent);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #238636, #2ea043);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2ea043, #3fb950);
        }

        .btn-danger {
            background: rgba(248, 81, 73, 0.1);
            color: var(--err);
            border-color: rgba(248, 81, 73, 0.3);
        }

        .btn-danger:hover {
            background: rgba(248, 81, 73, 0.2);
            border-color: var(--err);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .status.success {
            display: block;
            border: 1px solid var(--ok);
            color: var(--ok);
            background: rgba(63, 185, 80, 0.1);
        }

        .status.error {
            display: block;
            border: 1px solid var(--err);
            color: var(--err);
            background: rgba(248, 81, 73, 0.1);
        }

        .status.loading {
            display: block;
            border: 1px solid var(--warn);
            color: var(--warn);
            background: rgba(210, 153, 34, 0.1);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-box .value {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-box .label {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .log {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-time {
            color: var(--muted);
        }

        .log-info {
            color: var(--accent);
        }

        .log-success {
            color: var(--ok);
        }

        .log-error {
            color: var(--err);
        }

        .nav {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }

        .nav a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Memory Suite Admin</h1>

        <div class="nav">
            <a href="/live2d/index.html">Live2D</a>
            <a href="/danmaku/index.html">Danmaku</a>
            <a href="/admin.html">Admin</a>
        </div>

        <div class="section">
            <h2>Memory Dreaming</h2>
            <p style="color: var(--muted); font-size: 13px; margin: 0 0 16px;">
                手动触发记忆整理和反思。处理最近24小时的情景记忆，生成核心记忆和用户画像。
            </p>
            <div class="btn-group">
                <button class="btn btn-primary" id="dreamBtn">
                    <span>🌙</span> Run Dreaming
                </button>
                <button class="btn" id="statsBtn">
                    <span>📊</span> Get Stats
                </button>
            </div>
            <div class="status" id="dreamStatus"></div>
            <div class="stats" id="dreamStats" style="display: none;"></div>
        </div>

        <div class="section">
            <h2>System Status</h2>
            <div class="btn-group">
                <button class="btn" id="healthBtn">
                    <span>💚</span> Health Check
                </button>
                <button class="btn" id="warmupBtn">
                    <span>🔥</span> Warmup Embedding
                </button>
            </div>
            <div class="status" id="systemStatus"></div>
        </div>

        <div class="section">
            <h2>Activity Log</h2>
            <div class="log" id="activityLog">
                <div class="log-entry">
                    <span class="log-time">[--:--:--]</span>
                    <span class="log-info">Waiting for actions...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        const dreamBtn = document.getElementById('dreamBtn');
        const statsBtn = document.getElementById('statsBtn');
        const healthBtn = document.getElementById('healthBtn');
        const warmupBtn = document.getElementById('warmupBtn');
        const dreamStatus = document.getElementById('dreamStatus');
        const dreamStats = document.getElementById('dreamStats');
        const systemStatus = document.getElementById('systemStatus');
        const activityLog = document.getElementById('activityLog');

        function log(message, type = 'info') {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            activityLog.insertBefore(entry, activityLog.firstChild);

            while (activityLog.children.length > 50) {
                activityLog.removeChild(activityLog.lastChild);
            }
        }

        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = `status ${type}`;
        }

        function hideStatus(element) {
            element.className = 'status';
        }

        async function fetchAPI(endpoint, options = {}) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            return response.json();
        }

        dreamBtn.addEventListener('click', async () => {
            dreamBtn.disabled = true;
            showStatus(dreamStatus, 'Running dreaming... This may take 10-20 seconds.', 'loading');
            log('Starting dreaming process...', 'info');

            try {
                const startTime = Date.now();
                const result = await fetchAPI('/api/memory/dream', { method: 'POST' });
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

                if (result.success) {
                    const { memoriesProcessed, coreMemoriesCreated, userProfilesUpdated } = result.result;
                    showStatus(dreamStatus, `Done in ${elapsed}s! Processed ${memoriesProcessed} memories, created ${coreMemoriesCreated.length} core memories.`, 'success');
                    log(`Dreaming complete: ${memoriesProcessed} memories, ${coreMemoriesCreated.length} core, ${userProfilesUpdated.length} users updated`, 'success');
                } else {
                    showStatus(dreamStatus, `Error: ${result.error}`, 'error');
                    log(`Dreaming failed: ${result.error}`, 'error');
                }
            } catch (error) {
                showStatus(dreamStatus, `Error: ${error.message}`, 'error');
                log(`Dreaming error: ${error.message}`, 'error');
            } finally {
                dreamBtn.disabled = false;
            }
        });

        statsBtn.addEventListener('click', async () => {
            try {
                const result = await fetchAPI('/api/memory/stats');
                if (result.success) {
                    const stats = result.data;
                    dreamStats.style.display = 'grid';
                    dreamStats.innerHTML = `
                        <div class="stat-box">
                            <div class="value">${stats.vectorStore?.total || 0}</div>
                            <div class="label">Total Memories</div>
                        </div>
                        <div class="stat-box">
                            <div class="value">${stats.vectorStore?.byType?.episodic || 0}</div>
                            <div class="label">Episodic</div>
                        </div>
                        <div class="stat-box">
                            <div class="value">${stats.vectorStore?.byType?.semantic || 0}</div>
                            <div class="label">Semantic</div>
                        </div>
                        <div class="stat-box">
                            <div class="value">${stats.vectorStore?.byType?.core || 0}</div>
                            <div class="label">Core</div>
                        </div>
                    `;
                    log('Stats loaded', 'success');
                }
            } catch (error) {
                log(`Stats error: ${error.message}`, 'error');
            }
        });

        healthBtn.addEventListener('click', async () => {
            try {
                const result = await fetchAPI('/api/health');
                if (result.status === 'ok') {
                    showStatus(systemStatus, `System healthy! Uptime: ${Math.round(result.uptime || 0)}s`, 'success');
                    log('Health check passed', 'success');
                } else {
                    showStatus(systemStatus, 'System unhealthy', 'error');
                    log('Health check failed', 'error');
                }
            } catch (error) {
                showStatus(systemStatus, `Error: ${error.message}`, 'error');
                log(`Health check error: ${error.message}`, 'error');
            }
        });

        warmupBtn.addEventListener('click', async () => {
            warmupBtn.disabled = true;
            showStatus(systemStatus, 'Warming up embedding model...', 'loading');
            log('Starting embedding warmup...', 'info');

            try {
                const result = await fetchAPI('/api/memory/warmup', { method: 'POST' });
                if (result.success) {
                    showStatus(systemStatus, result.message, 'success');
                    log('Embedding model warmed up', 'success');
                } else {
                    showStatus(systemStatus, `Error: ${result.error}`, 'error');
                    log(`Warmup failed: ${result.error}`, 'error');
                }
            } catch (error) {
                showStatus(systemStatus, `Error: ${error.message}`, 'error');
                log(`Warmup error: ${error.message}`, 'error');
            } finally {
                warmupBtn.disabled = false;
            }
        });

        log('Admin panel loaded', 'info');
    </script>
</body>
</html>
