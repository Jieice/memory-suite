# Prometheus Alert Rules for Fallback System
# 
# Usage:
# 1. Copy this file to your Prometheus configuration directory
# 2. Add to prometheus.yml:
#    rule_files:
#      - 'prometheus-rules.yml'
# 3. Restart Prometheus

groups:
  - name: fallback_alerts
    interval: 30s
    rules:
      # Alert 1: High Fallback Rate (Warning)
      - alert: HighFallbackRate
        expr: fallback_rate > 0.05
        for: 5m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "High fallback rate for {{ $labels.service }}"
          description: "Fallback rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          runbook_url: "https://example.com/runbooks/high-fallback-rate"

      # Alert 2: Critical Fallback Rate (Critical)
      - alert: CriticalFallbackRate
        expr: fallback_rate > 0.10
        for: 2m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "CRITICAL: Fallback rate for {{ $labels.service }} is very high"
          description: "Fallback rate is {{ $value | humanizePercentage }} (threshold: 10%)"
          runbook_url: "https://example.com/runbooks/critical-fallback-rate"

      # Alert 3: Service Unavailable (Critical)
      - alert: ServiceUnavailable
        expr: service_availability < 0.95
        for: 5m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "Service {{ $labels.service }} availability below 95%"
          description: "Availability is {{ $value | humanizePercentage }}"
          runbook_url: "https://example.com/runbooks/service-unavailable"

      # Alert 4: Service Completely Down (Critical)
      - alert: ServiceDown
        expr: service_availability < 0.50
        for: 2m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Availability is {{ $value | humanizePercentage }}"
          runbook_url: "https://example.com/runbooks/service-down"

      # Alert 5: High Fallback Latency (Warning)
      - alert: HighFallbackLatency
        expr: fallback_latency_ms > 50
        for: 5m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "High fallback latency for {{ $labels.service }}"
          description: "Fallback latency is {{ $value }}ms (threshold: 50ms)"
          runbook_url: "https://example.com/runbooks/high-fallback-latency"

      # Alert 6: Critical Fallback Latency (Critical)
      - alert: CriticalFallbackLatency
        expr: fallback_latency_ms > 100
        for: 2m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "CRITICAL: Fallback latency for {{ $labels.service }} is very high"
          description: "Fallback latency is {{ $value }}ms (threshold: 100ms)"
          runbook_url: "https://example.com/runbooks/critical-fallback-latency"

      # Alert 7: Service Response Time Degradation (Warning)
      - alert: ServiceResponseTimeDegradation
        expr: service_response_time_ms{quantile="0.95"} > 5000
        for: 5m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "Service {{ $labels.service }} response time degradation"
          description: "P95 response time is {{ $value }}ms (threshold: 5000ms)"
          runbook_url: "https://example.com/runbooks/response-time-degradation"

      # Alert 8: Critical Response Time (Critical)
      - alert: CriticalResponseTime
        expr: service_response_time_ms{quantile="0.95"} > 10000
        for: 2m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "CRITICAL: Service {{ $labels.service }} response time is critical"
          description: "P95 response time is {{ $value }}ms (threshold: 10000ms)"
          runbook_url: "https://example.com/runbooks/critical-response-time"

      # Alert 9: High Error Rate (Warning)
      - alert: HighErrorRate
        expr: rate(error_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }}/sec (threshold: 0.01/sec)"
          runbook_url: "https://example.com/runbooks/high-error-rate"

      # Alert 10: Critical Error Rate (Critical)
      - alert: CriticalErrorRate
        expr: rate(error_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "CRITICAL: Error rate is very high"
          description: "Error rate is {{ $value | humanize }}/sec (threshold: 0.05/sec)"
          runbook_url: "https://example.com/runbooks/critical-error-rate"

      # Alert 11: Repeated Service Failures (Critical)
      - alert: RepeatedServiceFailures
        expr: increase(error_total[10m]) > 10
        for: 2m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "Repeated failures for {{ $labels.service }}"
          description: "{{ $value }} errors in last 10 minutes"
          runbook_url: "https://example.com/runbooks/repeated-failures"

      # Alert 12: Slow Service Recovery (Warning)
      - alert: SlowServiceRecovery
        expr: recovery_time_ms > 30000
        for: 1m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "Slow recovery for {{ $labels.service }}"
          description: "Recovery time is {{ $value }}ms (threshold: 30000ms)"
          runbook_url: "https://example.com/runbooks/slow-recovery"

      # Alert 13: LLM Service Issues (Critical)
      - alert: LLMServiceIssues
        expr: fallback_rate{service="llm"} > 0.05
        for: 5m
        labels:
          severity: critical
          component: llm
        annotations:
          summary: "LLM service is experiencing issues"
          description: "LLM fallback rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://example.com/runbooks/llm-issues"

      # Alert 14: TTS Service Issues (Critical)
      - alert: TTSServiceIssues
        expr: fallback_rate{service="tts"} > 0.05
        for: 5m
        labels:
          severity: critical
          component: tts
        annotations:
          summary: "TTS service is experiencing issues"
          description: "TTS fallback rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://example.com/runbooks/tts-issues"

      # Alert 15: BrainNN Service Issues (Warning)
      - alert: BrainNNServiceIssues
        expr: fallback_rate{service="brainnn"} > 0.10
        for: 5m
        labels:
          severity: warning
          component: brainnn
        annotations:
          summary: "BrainNN service is experiencing issues"
          description: "BrainNN fallback rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://example.com/runbooks/brainnn-issues"

      # Alert 16: Multiple Services Failing (Critical)
      - alert: MultipleServiceFailures
        expr: count(service_availability < 0.95) > 2
        for: 5m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "Multiple services are failing"
          description: "{{ $value }} services have availability below 95%"
          runbook_url: "https://example.com/runbooks/multiple-failures"

      # Alert 17: Fallback System Overload (Critical)
      - alert: FallbackSystemOverload
        expr: rate(fallback_total[1m]) > 1
        for: 2m
        labels:
          severity: critical
          component: fallback
        annotations:
          summary: "Fallback system is overloaded"
          description: "Fallback rate is {{ $value | humanize }}/sec"
          runbook_url: "https://example.com/runbooks/fallback-overload"

      # Alert 18: Timeout Threshold Exceeded (Warning)
      - alert: TimeoutThresholdExceeded
        expr: rate(error_total{category=~".*TIMEOUT"}[5m]) > 0.005
        for: 5m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "Timeout errors are increasing"
          description: "Timeout error rate is {{ $value | humanize }}/sec"
          runbook_url: "https://example.com/runbooks/timeout-threshold"

      # Alert 19: Connection Errors (Warning)
      - alert: ConnectionErrors
        expr: rate(error_total{category=~"CONNECTION_REFUSED|DNS_RESOLUTION_FAILED"}[5m]) > 0.001
        for: 5m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "Connection errors detected"
          description: "Connection error rate is {{ $value | humanize }}/sec"
          runbook_url: "https://example.com/runbooks/connection-errors"

      # Alert 20: Fallback Message Rate High (Warning)
      - alert: HighFallbackMessageRate
        expr: rate(fallback_total{type="RETURN_MESSAGE"}[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          component: fallback
        annotations:
          summary: "High rate of fallback messages being returned"
          description: "Fallback message rate is {{ $value | humanize }}/sec"
          runbook_url: "https://example.com/runbooks/high-fallback-message-rate"

# Recording Rules for Performance Optimization
# These rules pre-compute commonly used queries
  - name: fallback_recording_rules
    interval: 15s
    rules:
      # Average fallback latency
      - record: fallback:latency:avg
        expr: avg(fallback_latency_ms)

      # P95 fallback latency
      - record: fallback:latency:p95
        expr: histogram_quantile(0.95, fallback_latency_ms)

      # P99 fallback latency
      - record: fallback:latency:p99
        expr: histogram_quantile(0.99, fallback_latency_ms)

      # Average service response time
      - record: service:response_time:avg
        expr: avg(service_response_time_ms)

      # P95 service response time
      - record: service:response_time:p95
        expr: histogram_quantile(0.95, service_response_time_ms)

      # Total fallback rate
      - record: fallback:rate:total
        expr: sum(rate(fallback_total[5m]))

      # Fallback rate by service
      - record: fallback:rate:by_service
        expr: sum by (service) (rate(fallback_total[5m]))

      # Error rate by category
      - record: error:rate:by_category
        expr: sum by (category) (rate(error_total[5m]))

      # Service availability average
      - record: service:availability:avg
        expr: avg(service_availability)

