<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记忆空间 - Memory Suite</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/knowledge.css">
</head>
<body>
<div class="wrap">
  <script src="js/nav.js"></script>

  <div class="page-hdr">
    <div>
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem">
        <div class="page-title">记忆空间</div>
        <span class="mcp-badge">🧠 Memory Space</span>
      </div>
      <div class="page-sub">知识库浏览 · 弹幕风格 · 知识获取</div>
    </div>
    <div style="display:flex;gap:.75rem">
      <button class="btn btn-s" onclick="loadAllKnowledge()">↻ 刷新</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="sTotalK">—</div><div class="stat-lbl">知识总数</div></div>
    <div class="stat-card"><div class="stat-val" id="sUntrained">—</div><div class="stat-lbl">待训练</div></div>
    <div class="stat-card"><div class="stat-val" id="sSessions">—</div><div class="stat-lbl">已训练次数</div></div>
    <div class="stat-card"><div class="stat-val" id="sModel">—</div><div class="stat-lbl">模型版本</div></div>
    <div class="stat-card"><div class="stat-val" id="sStatus">—</div><div class="stat-lbl">学习状态</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('browse')">📚 知识库浏览</div>
    <div class="tab" onclick="switchTab('danmaku')">💬 弹幕风格</div>
    <div class="tab" onclick="switchTab('fetch')">🔍 知识获取</div>
  </div>

  <!-- Browse -->
  <div class="tab-panel active" id="p-browse">
    <div class="sec">
      <div class="sec-title">📚 知识库条目</div>
      <div class="search-row">
        <input class="search-input" id="searchInput" placeholder="搜索知识库..." onkeydown="if(event.key==='Enter')searchKnowledge()">
        <button class="btn btn-p btn-sm" onclick="searchKnowledge()">搜索</button>
        <button class="btn btn-s btn-sm" onclick="loadAllKnowledge()">全部</button>
      </div>
      <div class="k-list" id="kList">
        <div class="empty">加载中...</div>
      </div>
    </div>
  </div>

  <!-- Danmaku Style -->
  <div class="tab-panel" id="p-danmaku">
    <div class="sec">
      <div class="sec-title">💬 弹幕风格学习</div>
      <div id="danmakuInfo">
        <div class="empty">加载中...</div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">🎨 风格训练</div>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:1rem">分析知识库文本的风格特征，让 AI 说话更有个性。</p>
      <button class="btn btn-p btn-sm" onclick="trainStyle()">训练风格</button>
    </div>
  </div>

  <!-- Fetch -->
  <div class="tab-panel" id="p-fetch">
    <div class="sec">
      <div class="sec-title">🔍 获取新知识</div>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:1rem">从网上抓取热点话题、百科知识等，存入知识库。</p>
      <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
        <button class="btn btn-w btn-sm" onclick="fetchHotTopics()">🔥 抓取热点话题</button>
      </div>
      <div class="search-row">
        <input class="search-input" id="fetchKeyword" placeholder="输入关键词，如：虚拟主播、游戏...">
        <button class="btn btn-s btn-sm" onclick="fetchFromSource('zhihu')">从知乎</button>
        <button class="btn btn-s btn-sm" onclick="fetchFromSource('baike')">从百科</button>
      </div>
      <div class="divider"></div>
      <div class="sec-title" style="font-size:.9rem">调度器</div>
      <div class="info-box">
        <div class="info-row"><span class="info-label">状态</span><span class="info-value" id="fetchStatus">—</span></div>
        <div class="info-row"><span class="info-label">已抓取</span><span class="info-value" id="fetchCount">0</span></div>
        <div class="info-row"><span class="info-label">失败次数</span><span class="info-value" id="fetchFailed">0</span></div>
        <div class="info-row"><span class="info-label">上次抓取</span><span class="info-value" id="fetchLast">-</span></div>
      </div>
      <div style="margin-top:.75rem">
        <button class="btn btn-s btn-sm" id="btnToggleSched" onclick="toggleScheduler()">启动调度器</button>
      </div>
    </div>
  </div>
</div>

<script src="js/knowledge.js"></script>
</body>
</html>
