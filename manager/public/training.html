<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRA 训练 - Memory Suite</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/training.css">
</head>
<body>
    <script src="js/nav.js"></script>
    <div class="page">
        <div class="page-title">LoRA 微调训练<small>一键数据准备 → 训练 → 导出部署</small></div>

        <div class="grid">
            <!-- 数据概览 -->
            <div class="card">
                <h2>数据概览</h2>
                <div id="data-stats">
                    <div class="stat-row"><span class="stat-label">加载中...</span></div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="refreshDataStats()">刷新统计</button>
                    <button class="btn btn-primary" id="btn-prepare" onclick="prepareData()">一键数据准备</button>
                </div>
            </div>

            <!-- 训练配置 -->
            <div class="card">
                <h2>训练配置</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>训练轮数 (Epochs)</label>
                        <input type="number" id="cfg-epochs" value="3" min="1" max="20">
                    </div>
                    <div class="form-group">
                        <label>学习率 (Learning Rate)</label>
                        <input type="text" id="cfg-lr" value="2e-4">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>批次大小 (Batch Size)</label>
                        <input type="number" id="cfg-batch" value="4" min="1" max="32">
                    </div>
                    <div class="form-group">
                        <label>LoRA 秩 (r)</label>
                        <input type="number" id="cfg-lora-r" value="16" min="4" max="128">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>LoRA Alpha</label>
                        <input type="number" id="cfg-lora-alpha" value="32" min="8" max="256">
                    </div>
                    <div class="form-group">
                        <label>基座模型</label>
                        <input type="text" id="cfg-model" value="Qwen/Qwen3-4B-Instruct">
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="btn-train" onclick="startTraining()">开始训练</button>
                    <button class="btn btn-danger" id="btn-abort" onclick="abortTraining()" disabled>中止训练</button>
                    <button class="btn btn-warning" id="btn-export" onclick="exportModel()">导出 GGUF</button>
                </div>
            </div>

            <!-- 训练状态 -->
            <div class="card full-width">
                <h2>训练状态 <span id="status-badge" class="status-badge idle">IDLE</span></h2>
                <div class="metrics" id="metrics">
                    <div class="metric"><div class="value" id="m-epoch">-</div><div class="label">Epoch</div></div>
                    <div class="metric"><div class="value" id="m-step">-</div><div class="label">Step</div></div>
                    <div class="metric"><div class="value" id="m-loss">-</div><div class="label">Loss</div></div>
                    <div class="metric"><div class="value" id="m-lr">-</div><div class="label">Learning Rate</div></div>
                </div>
                <div class="progress-bar"><div class="fill" id="progress-fill" style="width: 0%"></div></div>
                <div class="log-viewer" id="log-viewer">等待操作...</div>
            </div>

            <!-- 训练历史 -->
            <div class="card full-width">
                <h2>训练历史</h2>
                <table class="history-table">
                    <thead><tr><th>时间</th><th>模型</th><th>Epochs</th><th>LR</th><th>最终 Loss</th><th>状态</th><th>耗时</th></tr></thead>
                    <tbody id="history-body"><tr><td colspan="7" style="color: var(--muted); text-align: center;">暂无训练记录</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/training.js"></script>
</body>
</html>
