<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>忆境 Live2D 浮窗</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(7, 13, 24, 0.78);
        --stroke: rgba(255, 255, 255, 0.12);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #8bd3ff;
        --danger: #fda4af;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }

      body {
        overflow: hidden;
      }

      .overlay-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #stage {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .chrome {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
        padding: 18px 22px 24px;
      }

      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .meta-cluster {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(139, 211, 255, 0.12);
        border: 1px solid rgba(139, 211, 255, 0.32);
        color: var(--accent);
        font-size: 13px;
      }

      .hint-badge {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.16);
        color: var(--muted);
      }

      .status-danger {
        color: var(--danger);
        border-color: rgba(253, 164, 175, 0.4);
        background: rgba(127, 29, 29, 0.28);
      }

      .subtitle-wrap {
        width: min(1080px, 100%);
        margin: 0 auto;
      }

      .subtitle-card {
        padding: 18px 24px;
        border: 1px solid var(--stroke);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.58));
        backdrop-filter: blur(14px);
        box-shadow: 0 26px 80px rgba(15, 23, 42, 0.34);
      }

      .subtitle {
        margin: 0;
        font-size: clamp(28px, 3vw, 44px);
        line-height: 1.35;
        letter-spacing: 0.03em;
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.4);
      }

      .empty {
        opacity: 0.72;
      }

      .error-card {
        max-width: 520px;
        padding: 14px 16px;
        border: 1px solid rgba(253, 164, 175, 0.35);
        border-radius: 18px;
        background: rgba(127, 29, 29, 0.5);
        color: #ffe4e6;
        font-size: 14px;
      }

      body[data-mode="pet"] .chrome {
        justify-content: flex-end;
        padding: 0 18px 22px;
      }

      body[data-mode="pet"]::before {
        content: "";
        position: fixed;
        top: 0;
        left: 18%;
        right: 18%;
        height: 34px;
        z-index: 4;
        -webkit-app-region: drag;
      }

      body[data-mode="pet"] .meta-row {
        display: none;
      }

      body[data-mode="pet"] .subtitle-wrap {
        width: 100%;
      }

      body[data-mode="pet"] .subtitle-card {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
      }

      body[data-mode="pet"] .subtitle {
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.28;
        text-shadow:
          0 2px 2px rgba(40, 37, 44, 0.9),
          0 0 14px rgba(40, 37, 44, 0.72);
      }

      body[data-mode="pet"] .subtitle.empty {
        display: none;
      }
    </style>
    <script src="/overlay-vendor/pixi/pixi.min.js"></script>
    <script src="/overlay-vendor/live2d-core/live2dcubismcore.min.js"></script>
    <script src="/overlay-vendor/live2d/cubism4.min.js"></script>
  </head>
  <body data-overlay="live2d">
    <main class="overlay-shell">
      <div id="stage"></div>
      <div class="chrome">
        <section class="meta-row">
          <div class="meta-cluster">
            <span class="badge" id="emotion">表情：normal</span>
            <span class="badge" id="config">scale 0.25 · x 0.30 · y 0.50</span>
            <span class="badge" id="speech-status">语音：空闲</span>
            <span class="badge hint-badge" id="drag-hint">拖动角色可调整位置</span>
          </div>
          <div class="error-card" id="error" hidden>缺少 Live2D 模型资源。</div>
        </section>
        <section class="subtitle-wrap">
          <div class="subtitle-card">
            <p class="subtitle empty" id="subtitle">等待 Live2D 字幕...</p>
          </div>
        </section>
      </div>
    </main>
    <script>
      const MODEL_PATH = '/live2d-assets/hiyori_pro_t11.model3.json';
      const searchParams = new URLSearchParams(location.search);
      const overlayMode = searchParams.get('mode');
      if (overlayMode) {
        document.body.dataset.mode = overlayMode;
      }
      if (searchParams.get('electron') === '1') {
        document.body.dataset.host = 'electron';
      }
      const subtitleEl = document.getElementById('subtitle');
      const emotionEl = document.getElementById('emotion');
      const configEl = document.getElementById('config');
      const speechStatusEl = document.getElementById('speech-status');
      const errorEl = document.getElementById('error');
      const dragHintEl = document.getElementById('drag-hint');
      const stageEl = document.getElementById('stage');

      let app = null;
      let model = null;
      let currentState = null;
      let clearSubtitleTimer = null;
      let dragState = {
        active: false,
        offsetX: 0,
        offsetY: 0,
        moved: false,
      };
      let speechState = {
        currentId: null,
        finishingId: null,
        fetchingNext: false,
        mouthLoop: null,
        subtitleLoop: null,
        audio: null,
        audioContext: null,
        analyser: null,
        sourceNode: null,
        motionTimers: [],
        startedAt: 0,
        pollTimer: null,
        blockedItem: null,
        resumeAttempting: false,
      };

      function clamp01(value) {
        return Math.max(0, Math.min(1, Number(value || 0)));
      }

      function effectiveConfig() {
        return currentState?.config || { scale: 0.25, x: 0.3, y: 0.5 };
      }

      function syncConfigBadge(cfg) {
        configEl.textContent = `scale ${Number(cfg.scale || 0.25).toFixed(2)} · x ${Number(cfg.x || 0.3).toFixed(2)} · y ${Number(cfg.y || 0.5).toFixed(2)}`;
      }

      function scheduleSubtitleClear(expectedText, durationMs) {
        if (clearSubtitleTimer) {
          clearTimeout(clearSubtitleTimer);
          clearSubtitleTimer = null;
        }
        const nextDuration = Math.max(0, Number(durationMs || 0));
        if (expectedText?.trim() && nextDuration > 0) {
          clearSubtitleTimer = setTimeout(() => {
            if (subtitleEl.textContent.trim().length > 0) {
              subtitleEl.textContent = '等待 Live2D 字幕...';
              subtitleEl.classList.add('empty');
            }
          }, nextDuration);
        }
      }

      function renderState(state) {
        currentState = state;
        if (!speechState.currentId && !speechState.finishingId && !speechState.blockedItem) {
          scheduleSubtitleClear(state?.subtitle, state?.subtitle_duration_ms);
          emotionEl.textContent = `表情：${state?.emotion || 'normal'}`;
        }
        syncConfigBadge(effectiveConfig());
        applyModelState();
      }

      function showError(message) {
        errorEl.hidden = false;
        errorEl.textContent = message;
        errorEl.classList.add('status-danger');
      }

      function clearError() {
        errorEl.hidden = true;
        errorEl.textContent = '';
        errorEl.classList.remove('status-danger');
      }

      function setSpeechStatus(text) {
        speechStatusEl.textContent = `语音：${text}`;
      }

      function clearSpeechRuntime() {
        if (speechState.mouthLoop) {
          cancelAnimationFrame(speechState.mouthLoop);
          speechState.mouthLoop = null;
        }
        if (speechState.subtitleLoop) {
          cancelAnimationFrame(speechState.subtitleLoop);
          speechState.subtitleLoop = null;
        }
        for (const timer of speechState.motionTimers) {
          clearTimeout(timer);
        }
        speechState.motionTimers = [];

        if (speechState.audio) {
          speechState.audio.pause();
        }
        try {
          if (speechState.sourceNode && typeof speechState.sourceNode.disconnect === 'function') {
            speechState.sourceNode.disconnect();
          }
        } catch (_) {}
        speechState.audio = null;
        speechState.sourceNode = null;
        speechState.analyser = null;
        speechState.currentId = null;
        speechState.finishingId = null;
        speechState.startedAt = 0;
        speechState.blockedItem = null;
        speechState.resumeAttempting = false;
        emotionEl.textContent = `表情：${currentState?.emotion || 'normal'}`;
      }

      function claimSpeechFinalization(id) {
        if (!id || speechState.currentId !== id || speechState.finishingId === id) {
          return false;
        }
        speechState.finishingId = id;
        return true;
      }

      function setMouthOpen(value) {
        if (!model) return;
        const clamped = Math.max(0, Math.min(1, Number(value || 0)));
        try {
          const coreModel = model?.internalModel?.coreModel;
          if (coreModel && typeof coreModel.setParameterValueById === 'function') {
            coreModel.setParameterValueById('ParamMouthOpenY', clamped, 1);
          }
        } catch (_) {}
      }

      function visemeAt(timeline, elapsedMs) {
        if (!Array.isArray(timeline) || timeline.length === 0) return 0;
        const current = timeline.find((cue) => elapsedMs >= cue.start_ms && elapsedMs < cue.end_ms);
        return Number(current?.mouth_open || 0);
      }

      function audioEnergy() {
        if (!speechState.analyser) return 0;
        const analyser = speechState.analyser;
        const data = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i += 1) {
          const normalized = (data[i] - 128) / 128;
          sum += normalized * normalized;
        }
        return Math.min(1, Math.sqrt(sum / data.length) * 3.2);
      }

      function runMotionTimeline(timeline) {
        if (!Array.isArray(timeline)) return;
        for (const cue of timeline) {
          if (!cue || typeof cue.motion !== 'string') continue;
          const timer = setTimeout(() => {
            if (!model || typeof model.motion !== 'function') return;
            try {
              model.motion(cue.motion);
            } catch (_) {}
          }, Math.max(0, Number(cue.at_ms || 0)));
          speechState.motionTimers.push(timer);
        }
      }

      async function ackSpeech(id, status, errorMessage) {
        try {
          await fetch(`/api/live2d/speech/${encodeURIComponent(id)}/ack`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              status,
              error: errorMessage || null,
            }),
          });
        } catch (_) {}
      }

      async function fetchNextSpeech() {
        const response = await fetch('/api/live2d/speech/next');
        if (!response.ok) {
          throw new Error(`speech queue ${response.status}`);
        }
        const payload = await response.json();
        return payload?.item || null;
      }

      function subtitleProgressText(text, elapsedMs, durationMs) {
        const source = String(text || '');
        if (!source.trim()) return '';
        const duration = Math.max(1, Number(durationMs || 0));
        const chars = Array.from(source);
        const visibleCount = Math.min(
          chars.length,
          Math.max(1, Math.ceil((Math.max(0, elapsedMs) / duration) * chars.length)),
        );
        return chars.slice(0, visibleCount).join('');
      }

      function startSubtitleLoop(item) {
        const fullText = String(item?.assistant_text || item?.animation?.subtitle_text || '');
        if (!fullText.trim()) {
          subtitleEl.textContent = '等待 Live2D 字幕...';
          subtitleEl.classList.add('empty');
          return;
        }

        const tick = () => {
          if (speechState.currentId !== item.id || speechState.finishingId === item.id) {
            subtitleEl.textContent = fullText;
            subtitleEl.classList.remove('empty');
            return;
          }
          const elapsedMs = Math.max(0, performance.now() - speechState.startedAt);
          const subtitle = subtitleProgressText(fullText, elapsedMs, item?.speech?.duration_ms);
          subtitleEl.textContent = subtitle;
          subtitleEl.classList.toggle('empty', !subtitle.trim());
          speechState.subtitleLoop = requestAnimationFrame(tick);
        };

        speechState.subtitleLoop = requestAnimationFrame(tick);
      }

      function startMouthLoop(item) {
        const timeline = item?.speech?.viseme_timeline || [];
        const duration = Number(item?.speech?.duration_ms || 0);
        speechState.startedAt = performance.now();

        const tick = () => {
          const elapsed = performance.now() - speechState.startedAt;
          const timelineMouth = visemeAt(timeline, elapsed);
          const energyMouth = audioEnergy();
          setMouthOpen(Math.max(timelineMouth * 1.35, energyMouth * 1.2));
          if (elapsed <= duration + 500 && speechState.currentId === item.id) {
            speechState.mouthLoop = requestAnimationFrame(tick);
          } else {
            setMouthOpen(0);
          }
        };
        speechState.mouthLoop = requestAnimationFrame(tick);
      }

      async function tryResumeBlockedSpeech() {
        if (
          speechState.resumeAttempting ||
          !speechState.blockedItem ||
          speechState.currentId ||
          speechState.finishingId
        ) {
          return;
        }
        speechState.resumeAttempting = true;
        try {
          const item = speechState.blockedItem;
          speechState.blockedItem = null;
          await playSpeechItem(item);
        } finally {
          speechState.resumeAttempting = false;
        }
      }

      async function playSpeechItem(item) {
        if (!item || speechState.currentId || speechState.finishingId) return;
        if (item.speech?.status !== 'ready' || !item.speech?.audio_url) {
          await ackSpeech(item.id, 'failed', item.speech?.error || '语音条目尚未就绪');
          return;
        }

        clearSpeechRuntime();
        speechState.currentId = item.id;
        setSpeechStatus(`播放中 ${item.id.slice(0, 8)}`);
        emotionEl.textContent = `表情：${item?.animation?.emotion || 'normal'}`;
        if (item?.assistant_text?.trim()) {
          subtitleEl.textContent = '';
          subtitleEl.classList.add('empty');
        }

        try {
          const audio = new Audio(item.speech.audio_url);
          audio.preload = 'auto';
          audio.crossOrigin = 'anonymous';

          speechState.audio = audio;
          if (!speechState.audioContext) {
            speechState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          const context = speechState.audioContext;
          if (context && context.state === 'suspended') {
            void context.resume().catch(() => {});
          }
          if (context) {
            const source = context.createMediaElementSource(audio);
            const analyser = context.createAnalyser();
            analyser.fftSize = 1024;
            source.connect(analyser);
            analyser.connect(context.destination);
            speechState.sourceNode = source;
            speechState.analyser = analyser;
          }

          runMotionTimeline(item.animation?.motion_timeline || []);
          startMouthLoop(item);

          // Start subtitle loop only when audio actually begins playing,
          // so elapsed time is accurate from the first frame.
          audio.addEventListener(
            'playing',
            () => {
              speechState.startedAt = performance.now();
              startSubtitleLoop(item);
            },
            { once: true },
          );

          audio.addEventListener(
            'ended',
            async () => {
              if (!claimSpeechFinalization(item.id)) return;
              const fullText = String(item?.assistant_text || item?.animation?.subtitle_text || '');
              if (fullText.trim()) {
                subtitleEl.textContent = fullText;
                subtitleEl.classList.remove('empty');
              }
              scheduleSubtitleClear(item.assistant_text, 2000);
              await ackSpeech(item.id, 'completed');
              clearSpeechRuntime();
              setSpeechStatus('空闲');
              void maybePlayNextSpeech();
            },
            { once: true },
          );
          audio.addEventListener(
            'error',
            async () => {
              if (!claimSpeechFinalization(item.id)) return;
              await ackSpeech(item.id, 'failed', 'audio playback error');
              clearSpeechRuntime();
              setSpeechStatus('错误');
              void maybePlayNextSpeech();
            },
            { once: true },
          );

          await audio.play();
        } catch (error) {
          if (error instanceof Error && error.name === 'NotAllowedError') {
            if (clearSubtitleTimer) {
              clearTimeout(clearSubtitleTimer);
              clearSubtitleTimer = null;
            }
            runMotionTimeline(item.animation?.motion_timeline || []);
            startMouthLoop(item);
            startSubtitleLoop(item);
            speechState.blockedItem = item;
            speechState.currentId = null;
            speechState.finishingId = null;
            setSpeechStatus(`等待交互 ${item.id.slice(0, 8)}`);
            return;
          }
          if (!claimSpeechFinalization(item.id)) return;
          runMotionTimeline(item.animation?.motion_timeline || []);
          startMouthLoop(item);
          startSubtitleLoop(item);
          setSpeechStatus(`仅口型 ${item.id.slice(0, 8)}`);
          const fallbackDuration = Math.max(900, Number(item?.speech?.duration_ms || 0));
          await new Promise((resolve) => {
            setTimeout(resolve, fallbackDuration);
          });
          await ackSpeech(
            item.id,
            'failed',
            error instanceof Error ? error.message : '语音播放失败',
          );
          clearSpeechRuntime();
          setSpeechStatus('错误');
          void maybePlayNextSpeech();
        }
      }

      async function maybePlayNextSpeech() {
        if (
          dragState.active ||
          speechState.currentId ||
          speechState.finishingId ||
          speechState.fetchingNext || speechState.blockedItem
        ) {
          return;
        }
        speechState.fetchingNext = true;
        try {
          const item = await fetchNextSpeech();
          if (!item) {
            setSpeechStatus('空闲');
            return;
          }
          await playSpeechItem(item);
        } catch (_) {
          setSpeechStatus('队列离线');
        } finally {
          speechState.fetchingNext = false;
        }
      }

      function ensureSpeechPolling() {
        if (speechState.pollTimer) return;
        speechState.pollTimer = setInterval(() => {
          if (!dragState.active && !speechState.currentId && !speechState.finishingId) {
            void maybePlayNextSpeech();
          }
        }, 350);
      }

      function applyModelState() {
        if (!model || !currentState || !app) return;
        const cfg = effectiveConfig();
        const baseScale = Math.min(app.renderer.width, app.renderer.height) / 1800;
        const nextScale = Math.max(0.05, Number(cfg.scale || 0.25)) * 3.2 * baseScale;
        model.scale.set(nextScale);
        model.x = app.renderer.width * Number(cfg.x || 0.3);
        model.y = app.renderer.height * Number(cfg.y || 0.5);
        if (typeof model.anchor?.set === 'function') {
          model.anchor.set(0.5, 0.5);
        }
        if (!speechState.currentId && typeof model.motion === 'function') {
          const emotion = String(currentState.emotion || 'normal').toLowerCase();
          const motionMap = {
            happy: 'Tap',
            excited: 'Tap',
            angry: 'Flick',
            sad: 'FlickDown',
            surprised: 'FlickUp',
            normal: 'Idle',
          };
          const motionGroup = motionMap[emotion] || 'Idle';
          try {
            model.motion(motionGroup);
          } catch (_) {}
        }
      }

      function clientToStagePosition(clientX, clientY) {
        const rect = app.view.getBoundingClientRect();
        const ratioX = rect.width ? (clientX - rect.left) / rect.width : 0;
        const ratioY = rect.height ? (clientY - rect.top) / rect.height : 0;
        return {
          x: ratioX * app.renderer.width,
          y: ratioY * app.renderer.height,
        };
      }

      function setLocalModelPosition(stageX, stageY) {
        if (!currentState || !model || !app) return;
        currentState.config = {
          ...effectiveConfig(),
          x: clamp01(stageX / app.renderer.width),
          y: clamp01(stageY / app.renderer.height),
        };
        model.x = currentState.config.x * app.renderer.width;
        model.y = currentState.config.y * app.renderer.height;
        syncConfigBadge(currentState.config);
      }

      async function persistDraggedPosition() {
        if (!currentState) return;
        const cfg = effectiveConfig();
        const response = await fetch('/api/live2d/config', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            scale: Number(cfg.scale || 0.25),
            x: clamp01(cfg.x),
            y: clamp01(cfg.y),
          }),
        });
        if (!response.ok) {
          throw new Error(`live2d config ${response.status}`);
        }
        clearError();
        renderState(await response.json());
      }

      function endDrag() {
        if (!dragState.active) return;
        const shouldPersist = dragState.moved;
        dragState.active = false;
        dragState.offsetX = 0;
        dragState.offsetY = 0;
        dragState.moved = false;
        dragHintEl.textContent = '拖动角色可调整位置';
        if (!shouldPersist) return;
        void persistDraggedPosition().catch((error) => {
          showError(
            `位置保存失败：${error instanceof Error ? error.message : '未知错误'}`,
          );
        });
        void maybePlayNextSpeech();
      }

      function handleWindowPointerMove(event) {
        if (!dragState.active || !model || !app) return;
        const point = clientToStagePosition(event.clientX, event.clientY);
        setLocalModelPosition(point.x + dragState.offsetX, point.y + dragState.offsetY);
        dragState.moved = true;
      }

      function registerDragHandlers() {
        if (!model || !app) return;
        app.view.style.touchAction = 'none';
        model.interactive = true;
        model.cursor = 'grab';
        model.on('pointerdown', (event) => {
          const original = event?.data?.originalEvent;
          if (!original) return;
          const point = clientToStagePosition(original.clientX, original.clientY);
          dragState.active = true;
          dragState.offsetX = model.x - point.x;
          dragState.offsetY = model.y - point.y;
          dragState.moved = false;
          dragHintEl.textContent = '正在拖动，松开后保存';
          clearError();
        });
        window.addEventListener('pointermove', handleWindowPointerMove);
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);
      }

      function registerInteractionResume() {
        const resume = () => {
          void tryResumeBlockedSpeech();
        };
        window.addEventListener('pointerdown', resume);
        window.addEventListener('keydown', resume);
      }

      async function ensureModel() {
        if (model) {
          applyModelState();
          return;
        }
        if (!window.PIXI) {
          showError('Live2D 运行库缺失：PIXI 加载失败。');
          return;
        }
        if (!window.Live2DCubismCore) {
          showError('Live2D 运行库缺失：live2dcubismcore.min.js 加载失败。');
          return;
        }
        if (!window.PIXI.live2d) {
          showError('Live2D 运行库缺失：pixi-live2d-display 未注册。');
          return;
        }
        if (!window.PIXI.live2d.Live2DModel) {
          showError('Live2D 运行库缺失：Live2DModel 不可用。');
          return;
        }

        const probe = await fetch(MODEL_PATH, { method: 'HEAD' });
        if (!probe.ok) {
          showError(`缺少 Live2D 模型：${MODEL_PATH}`);
          return;
        }

        clearError();
        app = new window.PIXI.Application({
          resizeTo: stageEl,
          autoStart: true,
          backgroundAlpha: 0,
          antialias: true,
        });
        stageEl.innerHTML = '';
        stageEl.appendChild(app.view);

        try {
          model = await window.PIXI.live2d.Live2DModel.from(MODEL_PATH);
        } catch (error) {
          showError(
            `Live2D 模型加载失败：${error instanceof Error ? error.message : '未知错误'}`,
          );
          return;
        }
        app.stage.addChild(model);
        registerDragHandlers();
        applyModelState();
        window.addEventListener('resize', applyModelState);
      }

      async function refreshState() {
        const response = await fetch('/api/live2d/state');
        if (!response.ok) throw new Error(`live2d state ${response.status}`);
        renderState(await response.json());
      }

      function openStream() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${location.host}/ws/overlay`);
        socket.addEventListener('open', () => {
          void maybePlayNextSpeech();
        });
        socket.addEventListener('message', (message) => {
          try {
            const event = JSON.parse(message.data);
            const kind = String(event.kind || '');
            if (kind.startsWith('live2d_')) {
              if (!dragState.active) {
                void refreshState();
              }
              return;
            }
            if (kind === 'speech_ready') {
              void maybePlayNextSpeech();
            }
          } catch (_) {}
        });
        socket.addEventListener('close', () => setTimeout(openStream, 1000));
      }

      (async () => {
        try {
          await refreshState();
          await ensureModel();
          ensureSpeechPolling();
          registerInteractionResume();
          await maybePlayNextSpeech();
        } catch (error) {
          showError(error instanceof Error ? error.message : 'Live2D 浮窗初始化失败。');
        }
        openStream();
      })();
    </script>
  </body>
</html>
