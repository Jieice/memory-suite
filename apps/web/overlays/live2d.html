<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Suite Live2D Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(7, 13, 24, 0.78);
        --stroke: rgba(255, 255, 255, 0.12);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #8bd3ff;
        --danger: #fda4af;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }

      body {
        overflow: hidden;
      }

      .overlay-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #stage {
        position: absolute;
        inset: 0;
      }

      .chrome {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
        padding: 18px 22px 24px;
      }

      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .meta-cluster {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(139, 211, 255, 0.12);
        border: 1px solid rgba(139, 211, 255, 0.32);
        color: var(--accent);
        font-size: 13px;
      }

      .hint-badge {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.16);
        color: var(--muted);
      }

      .status-danger {
        color: var(--danger);
        border-color: rgba(253, 164, 175, 0.4);
        background: rgba(127, 29, 29, 0.28);
      }

      .subtitle-wrap {
        width: min(1080px, 100%);
        margin: 0 auto;
      }

      .subtitle-card {
        padding: 18px 24px;
        border: 1px solid var(--stroke);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.58));
        backdrop-filter: blur(14px);
        box-shadow: 0 26px 80px rgba(15, 23, 42, 0.34);
      }

      .subtitle {
        margin: 0;
        font-size: clamp(28px, 3vw, 44px);
        line-height: 1.35;
        letter-spacing: 0.03em;
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.4);
      }

      .empty {
        opacity: 0.72;
      }

      .error-card {
        max-width: 520px;
        padding: 14px 16px;
        border: 1px solid rgba(253, 164, 175, 0.35);
        border-radius: 18px;
        background: rgba(127, 29, 29, 0.5);
        color: #ffe4e6;
        font-size: 14px;
      }
    </style>
    <script src="/overlay-vendor/pixi/pixi.min.js"></script>
    <script src="/overlay-vendor/live2d-core/live2dcubismcore.min.js"></script>
    <script src="/overlay-vendor/live2d/cubism4.min.js"></script>
  </head>
  <body data-overlay="live2d">
    <main class="overlay-shell">
      <div id="stage"></div>
      <div class="chrome">
        <section class="meta-row">
          <div class="meta-cluster">
            <span class="badge" id="emotion">emotion: normal</span>
            <span class="badge" id="config">scale 0.25 · x 0.30 · y 0.50</span>
            <span class="badge" id="speech-status">speech: idle</span>
            <span class="badge hint-badge" id="drag-hint">drag to reposition</span>
          </div>
          <div class="error-card" id="error" hidden>Live2D model missing.</div>
        </section>
        <section class="subtitle-wrap">
          <div class="subtitle-card">
            <p class="subtitle empty" id="subtitle">等待 Live2D 字幕...</p>
          </div>
        </section>
      </div>
    </main>
    <script>
      const MODEL_PATH = '/live2d-assets/hiyori_pro_t11.model3.json';
      const subtitleEl = document.getElementById('subtitle');
      const emotionEl = document.getElementById('emotion');
      const configEl = document.getElementById('config');
      const speechStatusEl = document.getElementById('speech-status');
      const errorEl = document.getElementById('error');
      const dragHintEl = document.getElementById('drag-hint');
      const stageEl = document.getElementById('stage');

      let app = null;
      let model = null;
      let currentState = null;
      let dragState = {
        active: false,
        offsetX: 0,
        offsetY: 0,
        moved: false,
      };
      let speechState = {
        currentId: null,
        mouthLoop: null,
        audio: null,
        audioContext: null,
        analyser: null,
        sourceNode: null,
        motionTimers: [],
        startedAt: 0,
      };

      function clamp01(value) {
        return Math.max(0, Math.min(1, Number(value || 0)));
      }

      function effectiveConfig() {
        return currentState?.config || { scale: 0.25, x: 0.3, y: 0.5 };
      }

      function syncConfigBadge(cfg) {
        configEl.textContent = `scale ${Number(cfg.scale || 0.25).toFixed(2)} · x ${Number(cfg.x || 0.3).toFixed(2)} · y ${Number(cfg.y || 0.5).toFixed(2)}`;
      }

      function renderState(state) {
        currentState = state;
        const subtitle = state?.subtitle?.trim() || '等待 Live2D 字幕...';
        subtitleEl.textContent = subtitle;
        subtitleEl.classList.toggle('empty', !state?.subtitle?.trim());
        emotionEl.textContent = `emotion: ${state?.emotion || 'normal'}`;
        syncConfigBadge(effectiveConfig());
        applyModelState();
      }

      function showError(message) {
        errorEl.hidden = false;
        errorEl.textContent = message;
        errorEl.classList.add('status-danger');
      }

      function clearError() {
        errorEl.hidden = true;
        errorEl.textContent = '';
        errorEl.classList.remove('status-danger');
      }

      function setSpeechStatus(text) {
        speechStatusEl.textContent = `speech: ${text}`;
      }

      function clearSpeechRuntime() {
        if (speechState.mouthLoop) {
          cancelAnimationFrame(speechState.mouthLoop);
          speechState.mouthLoop = null;
        }
        for (const timer of speechState.motionTimers) {
          clearTimeout(timer);
        }
        speechState.motionTimers = [];

        if (speechState.audio) {
          speechState.audio.pause();
          speechState.audio.src = '';
        }
        speechState.audio = null;
        speechState.currentId = null;
        speechState.startedAt = 0;
      }

      function setMouthOpen(value) {
        if (!model) return;
        const clamped = Math.max(0, Math.min(1, Number(value || 0)));
        try {
          const coreModel = model?.internalModel?.coreModel;
          if (coreModel && typeof coreModel.setParameterValueById === 'function') {
            coreModel.setParameterValueById('ParamMouthOpenY', clamped, 1);
          }
        } catch (_) {}
      }

      function visemeAt(timeline, elapsedMs) {
        if (!Array.isArray(timeline) || timeline.length === 0) return 0;
        const current = timeline.find((cue) => elapsedMs >= cue.start_ms && elapsedMs < cue.end_ms);
        return Number(current?.mouth_open || 0);
      }

      function audioEnergy() {
        if (!speechState.analyser) return 0;
        const analyser = speechState.analyser;
        const data = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i += 1) {
          const normalized = (data[i] - 128) / 128;
          sum += normalized * normalized;
        }
        return Math.min(1, Math.sqrt(sum / data.length) * 3.2);
      }

      function runMotionTimeline(timeline) {
        if (!Array.isArray(timeline)) return;
        for (const cue of timeline) {
          if (!cue || typeof cue.motion !== 'string') continue;
          const timer = setTimeout(() => {
            if (!model || typeof model.motion !== 'function') return;
            try {
              model.motion(cue.motion);
            } catch (_) {}
          }, Math.max(0, Number(cue.at_ms || 0)));
          speechState.motionTimers.push(timer);
        }
      }

      async function ackSpeech(id, status, errorMessage) {
        try {
          await fetch(`/api/live2d/speech/${encodeURIComponent(id)}/ack`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              status,
              error: errorMessage || null,
            }),
          });
        } catch (_) {}
      }

      async function fetchNextSpeech() {
        const response = await fetch('/api/live2d/speech/next');
        if (!response.ok) {
          throw new Error(`speech queue ${response.status}`);
        }
        const payload = await response.json();
        return payload?.item || null;
      }

      function startMouthLoop(item) {
        const timeline = item?.speech?.viseme_timeline || [];
        const duration = Number(item?.speech?.duration_ms || 0);
        speechState.startedAt = performance.now();

        const tick = () => {
          const elapsed = performance.now() - speechState.startedAt;
          const timelineMouth = visemeAt(timeline, elapsed);
          const energyMouth = audioEnergy();
          setMouthOpen(Math.max(timelineMouth, energyMouth));
          if (elapsed <= duration + 500 && speechState.currentId === item.id) {
            speechState.mouthLoop = requestAnimationFrame(tick);
          } else {
            setMouthOpen(0);
          }
        };
        speechState.mouthLoop = requestAnimationFrame(tick);
      }

      async function playSpeechItem(item) {
        if (!item || speechState.currentId) return;
        if (item.speech?.status !== 'ready' || !item.speech?.audio_url) {
          await ackSpeech(item.id, 'failed', item.speech?.error || 'speech item not ready');
          return;
        }

        clearSpeechRuntime();
        speechState.currentId = item.id;
        setSpeechStatus(`playing ${item.id.slice(0, 8)}`);

        try {
          const audio = new Audio(item.speech.audio_url);
          audio.preload = 'auto';
          audio.crossOrigin = 'anonymous';

          speechState.audio = audio;
          if (!speechState.audioContext) {
            speechState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          const context = speechState.audioContext;
          if (context && context.state === 'suspended') {
            await context.resume();
          }
          if (context) {
            const source = context.createMediaElementSource(audio);
            const analyser = context.createAnalyser();
            analyser.fftSize = 1024;
            source.connect(analyser);
            analyser.connect(context.destination);
            speechState.sourceNode = source;
            speechState.analyser = analyser;
          }

          runMotionTimeline(item.animation?.motion_timeline || []);
          startMouthLoop(item);

          audio.addEventListener(
            'ended',
            async () => {
              await ackSpeech(item.id, 'completed');
              clearSpeechRuntime();
              setSpeechStatus('idle');
              void maybePlayNextSpeech();
            },
            { once: true },
          );
          audio.addEventListener(
            'error',
            async () => {
              await ackSpeech(item.id, 'failed', 'audio playback error');
              clearSpeechRuntime();
              setSpeechStatus('error');
              void maybePlayNextSpeech();
            },
            { once: true },
          );

          await audio.play();
        } catch (error) {
          await ackSpeech(
            item.id,
            'failed',
            error instanceof Error ? error.message : 'speech playback failed',
          );
          clearSpeechRuntime();
          setSpeechStatus('error');
        }
      }

      async function maybePlayNextSpeech() {
        if (dragState.active || speechState.currentId) return;
        const item = await fetchNextSpeech();
        if (!item) {
          setSpeechStatus('idle');
          return;
        }
        await playSpeechItem(item);
      }

      function applyModelState() {
        if (!model || !currentState || !app) return;
        const cfg = effectiveConfig();
        const baseScale = Math.min(app.renderer.width, app.renderer.height) / 1800;
        const nextScale = Math.max(0.05, Number(cfg.scale || 0.25)) * 3.2 * baseScale;
        model.scale.set(nextScale);
        model.x = app.renderer.width * Number(cfg.x || 0.3);
        model.y = app.renderer.height * Number(cfg.y || 0.5);
        if (typeof model.anchor?.set === 'function') {
          model.anchor.set(0.5, 0.5);
        }
        if (typeof model.motion === 'function') {
          const emotion = String(currentState.emotion || 'normal').toLowerCase();
          const motionMap = {
            happy: 'Tap',
            excited: 'Tap',
            angry: 'Flick',
            sad: 'FlickDown',
            surprised: 'FlickUp',
            normal: 'Idle',
          };
          const motionGroup = motionMap[emotion] || 'Idle';
          try {
            model.motion(motionGroup);
          } catch (_) {}
        }
      }

      function clientToStagePosition(clientX, clientY) {
        const rect = app.view.getBoundingClientRect();
        const ratioX = rect.width ? (clientX - rect.left) / rect.width : 0;
        const ratioY = rect.height ? (clientY - rect.top) / rect.height : 0;
        return {
          x: ratioX * app.renderer.width,
          y: ratioY * app.renderer.height,
        };
      }

      function setLocalModelPosition(stageX, stageY) {
        if (!currentState || !model || !app) return;
        currentState.config = {
          ...effectiveConfig(),
          x: clamp01(stageX / app.renderer.width),
          y: clamp01(stageY / app.renderer.height),
        };
        model.x = currentState.config.x * app.renderer.width;
        model.y = currentState.config.y * app.renderer.height;
        syncConfigBadge(currentState.config);
      }

      async function persistDraggedPosition() {
        if (!currentState) return;
        const cfg = effectiveConfig();
        const response = await fetch('/api/live2d/config', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            scale: Number(cfg.scale || 0.25),
            x: clamp01(cfg.x),
            y: clamp01(cfg.y),
          }),
        });
        if (!response.ok) {
          throw new Error(`live2d config ${response.status}`);
        }
        clearError();
        renderState(await response.json());
      }

      function endDrag() {
        if (!dragState.active) return;
        const shouldPersist = dragState.moved;
        dragState.active = false;
        dragState.offsetX = 0;
        dragState.offsetY = 0;
        dragState.moved = false;
        dragHintEl.textContent = 'drag to reposition';
        if (!shouldPersist) return;
        void persistDraggedPosition().catch((error) => {
          showError(
            `Position save failed: ${error instanceof Error ? error.message : 'unknown error'}`,
          );
        });
        void maybePlayNextSpeech();
      }

      function handleWindowPointerMove(event) {
        if (!dragState.active || !model || !app) return;
        const point = clientToStagePosition(event.clientX, event.clientY);
        setLocalModelPosition(point.x + dragState.offsetX, point.y + dragState.offsetY);
        dragState.moved = true;
      }

      function registerDragHandlers() {
        if (!model || !app) return;
        app.view.style.touchAction = 'none';
        model.interactive = true;
        model.cursor = 'grab';
        model.on('pointerdown', (event) => {
          const original = event?.data?.originalEvent;
          if (!original) return;
          const point = clientToStagePosition(original.clientX, original.clientY);
          dragState.active = true;
          dragState.offsetX = model.x - point.x;
          dragState.offsetY = model.y - point.y;
          dragState.moved = false;
          dragHintEl.textContent = 'dragging... release to save';
          clearError();
        });
        window.addEventListener('pointermove', handleWindowPointerMove);
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);
      }

      async function ensureModel() {
        if (model) {
          applyModelState();
          return;
        }
        if (!window.PIXI) {
          showError('Live2D runtime missing: PIXI failed to load.');
          return;
        }
        if (!window.Live2DCubismCore) {
          showError('Live2D runtime missing: live2dcubismcore.min.js failed to load.');
          return;
        }
        if (!window.PIXI.live2d) {
          showError('Live2D runtime missing: pixi-live2d-display failed to register.');
          return;
        }
        if (!window.PIXI.live2d.Live2DModel) {
          showError('Live2D runtime missing: Live2DModel export unavailable.');
          return;
        }

        const probe = await fetch(MODEL_PATH, { method: 'HEAD' });
        if (!probe.ok) {
          showError(`Live2D model missing at ${MODEL_PATH}`);
          return;
        }

        clearError();
        app = new window.PIXI.Application({
          resizeTo: stageEl,
          autoStart: true,
          backgroundAlpha: 0,
          antialias: true,
        });
        stageEl.innerHTML = '';
        stageEl.appendChild(app.view);

        try {
          model = await window.PIXI.live2d.Live2DModel.from(MODEL_PATH);
        } catch (error) {
          showError(
            `Live2D model load failed: ${error instanceof Error ? error.message : 'unknown error'}`,
          );
          return;
        }
        app.stage.addChild(model);
        registerDragHandlers();
        applyModelState();
        window.addEventListener('resize', applyModelState);
      }

      async function refreshState() {
        const response = await fetch('/api/live2d/state');
        if (!response.ok) throw new Error(`live2d state ${response.status}`);
        renderState(await response.json());
      }

      function openStream() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${location.host}/ws/overlay`);
        socket.addEventListener('message', (message) => {
          try {
            const event = JSON.parse(message.data);
            const kind = String(event.kind || '');
            if (kind.startsWith('live2d_')) {
              if (!dragState.active) {
                void refreshState();
              }
              return;
            }
            if (
              kind === 'speech_ready' ||
              kind === 'speech_started' ||
              kind === 'speech_completed' ||
              kind === 'speech_failed'
            ) {
              void maybePlayNextSpeech();
            }
          } catch (_) {}
        });
        socket.addEventListener('close', () => setTimeout(openStream, 1000));
      }

      (async () => {
        try {
          await refreshState();
          await ensureModel();
          await maybePlayNextSpeech();
        } catch (error) {
          showError(error instanceof Error ? error.message : 'Live2D overlay init failed.');
        }
        openStream();
      })();
    </script>
  </body>
</html>
