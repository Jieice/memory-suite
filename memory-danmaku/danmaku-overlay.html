<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹幕显示</title>
  <style>
    :root {
      --ui-scale: 1.2;
      --overlay-scale: 1.22;
      --panel-width: 440px;
      --msg-bg: rgba(255, 248, 250, 0.84);
      --msg-bg-alt: rgba(255, 243, 247, 0.8);
      --msg-border: rgba(255, 255, 255, 0.62);
      --msg-shadow: 0 10px 22px rgba(54, 34, 44, 0.22), 0 2px 8px rgba(17, 24, 39, 0.14);
      --accent-danmaku: #f472b6;
      --accent-gift: #ec4899;
      --accent-superchat: #f59e0b;
      --accent-guard: #ef4444;
      --text-user: #be4f8f;
      --text-main: #4b3340;
      --text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
      --outline-light: rgba(255, 255, 255, 0.95);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }

    #danmaku-container {
      position: fixed;
      left: 22px;
      top: 84px;
      width: var(--panel-width);
      max-height: calc(100vh - 130px);
      overflow-y: auto;
      overflow-x: hidden;
      pointer-events: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(244, 114, 182, 0.58) transparent;
      transform: scale(var(--overlay-scale));
      transform-origin: top left;
      padding-right: 4px;
      will-change: transform;
    }

    #danmaku-container::-webkit-scrollbar {
      width: 6px;
    }

    #danmaku-container::-webkit-scrollbar-track {
      background: transparent;
    }

    #danmaku-container::-webkit-scrollbar-thumb {
      background: rgba(244, 114, 182, 0.58);
      border-radius: 3px;
    }

    #danmaku-container::-webkit-scrollbar-thumb:hover {
      background: rgba(244, 114, 182, 0.74);
    }

    .danmaku-item {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--msg-bg) 0%, var(--msg-bg-alt) 100%);
      border-left: 4px solid var(--accent-danmaku);
      padding: 12px 14px;
      margin-bottom: 10px;
      border-radius: 15px;
      animation: slideInLeft 340ms cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: var(--msg-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--msg-border);
      border-top-color: rgba(255, 255, 255, 0.92);
    }

    .danmaku-item::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.42) 0%,
        rgba(255, 255, 255, 0.04) 42%,
        rgba(255, 255, 255, 0) 100%
      );
    }

    .danmaku-item.gift {
      border-left-color: var(--accent-gift);
      background: linear-gradient(145deg, rgba(255, 242, 248, 0.86) 0%, rgba(255, 236, 246, 0.82) 100%);
    }

    .danmaku-item.superchat {
      border-left-color: var(--accent-superchat);
      background: linear-gradient(145deg, rgba(255, 249, 232, 0.88) 0%, rgba(255, 244, 212, 0.82) 100%);
      animation: slideInLeft 340ms cubic-bezier(0.22, 1, 0.36, 1), softGlow 2.4s ease-in-out infinite;
    }

    .danmaku-item.guard {
      border-left-color: var(--accent-guard);
      background: linear-gradient(145deg, rgba(255, 243, 243, 0.86) 0%, rgba(255, 234, 234, 0.82) 100%);
      animation: slideInLeft 340ms cubic-bezier(0.22, 1, 0.36, 1), softGlow 2.2s ease-in-out infinite;
    }

    .danmaku-username {
      color: var(--text-user);
      font-weight: 800;
      font-size: calc(14px * var(--ui-scale));
      margin-bottom: 4px;
      text-shadow: var(--text-shadow);
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.2px;
    }

    .danmaku-item.gift .danmaku-username {
      color: var(--accent-gift);
    }

    .danmaku-item.superchat .danmaku-username {
      color: #b88210;
    }

    .danmaku-item.guard .danmaku-username {
      color: var(--accent-guard);
    }

    .danmaku-message {
      color: var(--text-main);
      font-size: calc(15px * var(--ui-scale));
      font-weight: 600;
      line-height: 1.5;
      word-wrap: break-word;
      text-shadow: var(--text-shadow);
    }

    .danmaku-message .emoji {
      font-size: calc(18px * var(--ui-scale));
      vertical-align: middle;
      display: inline-block;
      margin: 0 2px;
      filter: drop-shadow(0 1px 2px rgba(17, 24, 39, 0.2));
    }

    .danmaku-username .emoji {
      font-size: calc(18px * var(--ui-scale));
    }

    .danmaku-username,
    .danmaku-message {
      -webkit-text-stroke: 0.55px var(--outline-light);
      paint-order: stroke fill;
    }

    @keyframes slideInLeft {
      from {
        transform: translateX(-26px) scale(0.96);
        opacity: 0;
      }
      to {
        transform: translateX(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes softGlow {
      0%,
      100% {
        box-shadow: 0 10px 22px rgba(54, 34, 44, 0.23), 0 0 0 1px rgba(255, 255, 255, 0.36);
      }
      50% {
        box-shadow: 0 12px 26px rgba(54, 34, 44, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.5);
      }
    }

    @media (max-width: 1366px) {
      :root {
        --overlay-scale: 1.08;
        --panel-width: 420px;
      }
    }

    @media (max-width: 1100px) {
      :root {
        --overlay-scale: 1;
        --panel-width: min(80vw, 400px);
      }

      #danmaku-container {
        top: 76px;
      }
    }
  </style>
</head>
<body>
  <div id="danmaku-container"></div>

  <script>
    const container = document.getElementById("danmaku-container");
    const MAX_DANMAKU = 50;
    const DANMAKU_LIFETIME = 0; // 0 means keep message until capped by MAX_DANMAKU
    const DANMAKU_PORT = 4003;  // Danmaku bridge WebSocket port (fixed)

    const emojiMap = {
      "[doge]": "🐶",
      "[微笑]": "😊",
      "[大笑]": "😄",
      "[哭]": "😢",
      "[生气]": "😠",
      "[惊讶]": "😲",
      "[爱心]": "❤️",
      "[点赞]": "👍",
      "[OK]": "👌",
      "[加油]": "💪",
      "[666]": "🔥",
      "[星星]": "⭐",
      "[月亮]": "🌙",
      "[太阳]": "☀️",
      "[礼物]": "🎁",
      "[音乐]": "🎵"
    };

    let ws = null;
    let reconnectTimer = null;

    function connectWebSocket() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      const wsUrl = `ws://127.0.0.1:${DANMAKU_PORT}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("[danmaku-overlay] websocket connected:", wsUrl);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          addDanmaku(data);
        } catch (err) {
          console.warn("[danmaku-overlay] failed to parse websocket payload:", err.message);
        }
      };

      ws.onerror = (err) => {
        console.warn("[danmaku-overlay] websocket error:", err?.message || err);
      };

      ws.onclose = () => {
        console.warn("[danmaku-overlay] websocket closed, reconnect in 5s");
        reconnectTimer = setTimeout(connectWebSocket, 5000);
      };
    }

    function addDanmaku(payload) {
      const username = String(payload?.username || payload?.userId || "").trim();
      const message = String(payload?.message || "").trim();
      const type = normalizeType(payload?.type);

      if (!username || !message) {
        return;
      }

      const item = document.createElement("div");
      item.className = `danmaku-item ${type}`;

      const processedMessage = processEmojis(message);
      const typeIcon = getTypeIcon(type);
      item.innerHTML = `
        <div class="danmaku-username">
          <span class="emoji">${typeIcon}</span>
          ${escapeHtml(username)}
        </div>
        <div class="danmaku-message">${processedMessage}</div>
      `;

      container.insertBefore(item, container.firstChild);

      while (container.children.length > MAX_DANMAKU) {
        container.removeChild(container.lastChild);
      }

      container.scrollTop = 0;

      if (DANMAKU_LIFETIME > 0) {
        setTimeout(() => fadeOut(item), DANMAKU_LIFETIME);
      }
    }

    function normalizeType(type) {
      if (type === "gift" || type === "superchat" || type === "guard") {
        return type;
      }
      return "danmaku";
    }

    function getTypeIcon(type) {
      if (type === "gift") return "🎁";
      if (type === "superchat") return "💰";
      if (type === "guard") return "🛡️";
      return "💬";
    }

    function fadeOut(item) {
      if (!item?.parentNode) {
        return;
      }
      item.style.transition = "opacity 0.5s, transform 0.5s";
      item.style.opacity = "0";
      item.style.transform = "translateX(-20px)";
      setTimeout(() => {
        if (item.parentNode) {
          item.parentNode.removeChild(item);
        }
      }, 500);
    }

    function processEmojis(text) {
      let processed = escapeHtml(text);
      for (const [token, emoji] of Object.entries(emojiMap)) {
        const pattern = new RegExp(escapeRegex(token), "g");
        processed = processed.replace(pattern, `<span class="emoji">${emoji}</span>`);
      }
      return processed;
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    connectWebSocket();
  </script>
</body>
</html>
