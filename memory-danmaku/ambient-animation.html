<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>环境动画层</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* 整体容器 */
    .ambient-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 1. 窗外光线变化（最重要的环境感） */
    .window-light {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 50%;
      background: radial-gradient(ellipse at 30% 30%, 
        rgba(255, 250, 220, 0.15) 0%, 
        rgba(255, 245, 200, 0.08) 40%, 
        transparent 70%);
      animation: sunlight 20s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    @keyframes sunlight {
      0%, 100% {
        opacity: 0.3;
        filter: hue-rotate(0deg);
      }
      50% {
        opacity: 0.5;
        filter: hue-rotate(10deg);
      }
    }

    /* 2. 房间整体呼吸光（非常微弱） */
    .room-breath {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 50%, 
        rgba(255, 240, 245, 0.03) 0%, 
        transparent 60%);
      animation: breathe 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 0.8;
      }
    }

    /* 3. 漂浮的光斑（3个，错开时间） */
    .light-particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, 
        rgba(255, 250, 240, 0.4) 0%, 
        rgba(255, 245, 230, 0.2) 40%, 
        transparent 70%);
      filter: blur(20px);
      mix-blend-mode: screen;
    }

    .particle-1 {
      width: 150px;
      height: 150px;
      top: 20%;
      left: 15%;
      animation: float1 12s ease-in-out infinite;
    }

    .particle-2 {
      width: 100px;
      height: 100px;
      top: 60%;
      right: 20%;
      animation: float2 15s ease-in-out infinite 3s;
    }

    .particle-3 {
      width: 80px;
      height: 80px;
      top: 40%;
      left: 60%;
      animation: float3 18s ease-in-out infinite 6s;
    }

    @keyframes float1 {
      0%, 100% {
        transform: translate(0, 0);
        opacity: 0.2;
      }
      50% {
        transform: translate(10px, -15px);
        opacity: 0.4;
      }
    }

    @keyframes float2 {
      0%, 100% {
        transform: translate(0, 0);
        opacity: 0.15;
      }
      50% {
        transform: translate(-8px, 12px);
        opacity: 0.35;
      }
    }

    @keyframes float3 {
      0%, 100% {
        transform: translate(0, 0);
        opacity: 0.18;
      }
      50% {
        transform: translate(12px, 8px);
        opacity: 0.38;
      }
    }

    /* 4. 星星闪烁（可选，非常微弱） */
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 250, 240, 0.6);
      border-radius: 50%;
      box-shadow: 0 0 3px rgba(255, 250, 240, 0.4);
    }

    .star-1 {
      top: 15%;
      right: 25%;
      animation: twinkle 4s ease-in-out infinite;
    }

    .star-2 {
      top: 25%;
      right: 35%;
      animation: twinkle 5s ease-in-out infinite 1s;
    }

    .star-3 {
      top: 35%;
      right: 15%;
      animation: twinkle 6s ease-in-out infinite 2s;
    }

    .star-4 {
      top: 45%;
      left: 20%;
      animation: twinkle 5.5s ease-in-out infinite 1.5s;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.3;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.2);
      }
    }

    /* 5. 书架区域微光（模拟书本反光） */
    .shelf-glow {
      position: absolute;
      top: 10%;
      right: 10%;
      width: 30%;
      height: 20%;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 248, 230, 0.08) 50%, 
        transparent 100%);
      animation: shelfShine 25s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    @keyframes shelfShine {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* 6. 窗帘轻微摆动（色彩变化，不是位移） */
    .curtain-sway {
      position: absolute;
      top: 0;
      left: 0;
      width: 35%;
      height: 60%;
      background: linear-gradient(to bottom, 
        rgba(255, 220, 230, 0.05) 0%, 
        transparent 100%);
      animation: curtainMove 30s ease-in-out infinite;
    }

    @keyframes curtainMove {
      0%, 100% {
        opacity: 0.3;
        transform: scaleX(1);
      }
      50% {
        opacity: 0.5;
        transform: scaleX(1.02);
      }
    }
  </style>
</head>
<body>
  <div class="ambient-container">
    <!-- 窗外光线 -->
    <div class="window-light"></div>
    
    <!-- 房间呼吸 -->
    <div class="room-breath"></div>
    
    <!-- 漂浮光斑 -->
    <div class="light-particle particle-1"></div>
    <div class="light-particle particle-2"></div>
    <div class="light-particle particle-3"></div>
    
    <!-- 星星闪烁 -->
    <div class="star star-1"></div>
    <div class="star star-2"></div>
    <div class="star star-3"></div>
    <div class="star star-4"></div>
    
    <!-- 书架微光 -->
    <div class="shelf-glow"></div>
    
    <!-- 窗帘摆动 -->
    <div class="curtain-sway"></div>
  </div>

  <script>
    const DANMAKU_PORT = 4003;  // Danmaku bridge WebSocket port (fixed)
    let ws;
    let currentAIStatus = 'idle';
    
    const windowLight = document.querySelector('.window-light');
    const roomBreath = document.querySelector('.room-breath');
    const particles = document.querySelectorAll('.light-particle');
    const stars = document.querySelectorAll('.star');

    const lightEffects = {
      idle: {
        windowFilter: 'hue-rotate(0deg) brightness(1)',
        roomOpacity: 0.5,
        particleOpacity: 0.3,
        starOpacity: 0.5,
        description: '平静的光线'
      },
      listening: {
        windowFilter: 'hue-rotate(-5deg) brightness(1.1) saturate(1.1)',
        roomOpacity: 0.6,
        particleOpacity: 0.4,
        starOpacity: 0.7,
        description: '光线微微变亮（倾听）'
      },
      thinking: {
        windowFilter: 'hue-rotate(15deg) brightness(1.15) saturate(1.2)',
        roomOpacity: 0.7,
        particleOpacity: 0.5,
        starOpacity: 0.8,
        description: '光线变暖（思考中）'
      },
      responding: {
        windowFilter: 'hue-rotate(5deg) brightness(1.25) saturate(1.15)',
        roomOpacity: 0.8,
        particleOpacity: 0.6,
        starOpacity: 0.9,
        description: '光线明亮（回复中）'
      }
    };

    function applyLightEffect(status) {
      const effect = lightEffects[status];
      if (!effect) return;
      
      console.log(`[Ambient] Light effect: ${status} - ${effect.description}`);
      
      windowLight.style.transition = 'filter 2s ease-in-out, opacity 2s ease-in-out';
      windowLight.style.filter = effect.windowFilter;
      
      roomBreath.style.transition = 'opacity 2s ease-in-out';
      roomBreath.style.opacity = effect.roomOpacity;
      
      particles.forEach(particle => {
        particle.style.transition = 'opacity 2s ease-in-out';
        particle.style.opacity = effect.particleOpacity;
      });
      
      stars.forEach(star => {
        star.style.transition = 'opacity 2s ease-in-out';
        star.style.opacity = effect.starOpacity;
      });
    }

    function connectWebSocket() {
      const wsHost = window.location.hostname || '127.0.0.1';
      ws = new WebSocket(`ws://${wsHost}:${DANMAKU_PORT}`);
      
      ws.onopen = () => {
        console.log('[Ambient] Connected to AI status service');
        applyLightEffect('idle');
      };
      
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          
          if (data.type === 'status' && data.status) {
            currentAIStatus = data.status;
            applyLightEffect(data.status);
          }
          else if (data.username && data.message) {
            applyLightEffect('listening');
          }
        } catch (err) {
          console.error('[Ambient] Parse error:', err);
        }
      };
      
      ws.onclose = () => {
        console.log('[Ambient] Disconnected, reconnecting in 5s...');
        setTimeout(connectWebSocket, 5000);
      };
      
      ws.onerror = (err) => {
        console.error('[Ambient] WebSocket error:', err);
      };
    }

    function adjustLightByTime() {
      const hour = new Date().getHours();
      const container = document.querySelector('.ambient-container');
      
      if (hour >= 6 && hour < 12) {
        container.style.filter = 'hue-rotate(5deg)';
      }
      else if (hour >= 12 && hour < 18) {
        container.style.filter = 'hue-rotate(0deg)';
      }
      else if (hour >= 18 && hour < 20) {
        container.style.filter = 'hue-rotate(10deg)';
      }
      else {
        container.style.filter = 'hue-rotate(-5deg) brightness(0.9)';
      }
    }

    connectWebSocket();
    adjustLightByTime();
    setInterval(adjustLightByTime, 60000);

    console.log('[Ambient] Animation layer loaded - AI status sync enabled');
  </script>
</body>
</html>
