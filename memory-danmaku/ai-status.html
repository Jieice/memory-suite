<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI状态</title>
  <style>
    :root {
      --ui-scale: 1.2;
      --panel-bg: rgba(16, 23, 39, 0.78);
      --panel-border: rgba(255, 255, 255, 0.22);
      --panel-shadow: 0 18px 42px rgba(2, 8, 20, 0.58);
      --text-main: #f8fafc;
      --text-subtle: rgba(226, 232, 240, 0.86);
      --text-muted: rgba(203, 213, 225, 0.74);
      --outline-dark: rgba(6, 12, 24, 0.95);
      --accent: #94a3b8;
      --accent-soft: rgba(148, 163, 184, 0.2);
      --accent-ring: rgba(148, 163, 184, 0.26);
      --accent-glow: rgba(148, 163, 184, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }

    #status-container {
      position: fixed;
      right: 30px;
      top: 30px;
      pointer-events: none;
      transform: scale(1.72);
      transform-origin: top right;
      will-change: transform;
    }

    .status-card {
      position: relative;
      overflow: hidden;
      background: var(--panel-bg);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      border-radius: 20px;
      padding: 20px 24px 18px;
      box-shadow: var(--panel-shadow);
      border: 1px solid var(--panel-border);
      min-width: 300px;
      color: var(--text-main);
      transition: border-color 240ms ease, box-shadow 240ms ease, background-color 240ms ease;
    }

    .status-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(140px 80px at 92% 0%, var(--accent-soft), transparent 72%),
        radial-gradient(130px 90px at 12% 100%, rgba(255, 255, 255, 0.07), transparent 78%);
      opacity: 0.95;
    }

    .status-card > * {
      position: relative;
      z-index: 1;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    .status-icon {
      font-size: calc(24px * var(--ui-scale));
      color: var(--accent);
      animation: pulse 2.6s ease-in-out infinite;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.24));
    }

    .status-label {
      font-size: calc(14px * var(--ui-scale));
      color: #c4d1ff;
      font-weight: 800;
      letter-spacing: 1.9px;
      text-shadow: 0 1px 2px rgba(2, 8, 20, 0.58);
      text-transform: uppercase;
    }

    .status-main {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .status-indicator {
      position: relative;
      width: calc(12px * var(--ui-scale));
      height: calc(12px * var(--ui-scale));
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.5s ease-in-out infinite;
      box-shadow: 0 0 0 calc(4px * var(--ui-scale)) var(--accent-ring), 0 0 calc(12px * var(--ui-scale)) var(--accent-glow);
    }

    .status-indicator::after {
      content: "";
      position: absolute;
      inset: calc(-7px * var(--ui-scale));
      border: 1px solid var(--accent-glow);
      border-radius: 50%;
      animation: ripple 2.2s ease-out infinite;
    }

    .status-text {
      font-size: calc(19px * var(--ui-scale));
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.2px;
      text-shadow: 0 2px 6px rgba(2, 8, 20, 0.6);
    }

    .status-extra {
      font-size: calc(13px * var(--ui-scale));
      color: var(--text-subtle);
      margin-left: 22px;
      line-height: 1.35;
      text-shadow: 0 1px 2px rgba(2, 8, 20, 0.45);
    }

    .status-metrics {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: calc(13px * var(--ui-scale));
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 8px 8px;
    }

    .metric-label {
      color: var(--text-muted);
      font-size: calc(11px * var(--ui-scale));
      font-weight: 600;
      letter-spacing: 0.25px;
      text-shadow: 0 1px 2px rgba(2, 8, 20, 0.42);
    }

    .metric-value {
      color: var(--text-main);
      font-weight: 700;
      font-size: calc(14px * var(--ui-scale));
      line-height: 1.2;
      text-shadow: 0 1px 3px rgba(2, 8, 20, 0.6);
    }

    .status-label,
    .status-text,
    .status-extra,
    .metric-label,
    .metric-value {
      -webkit-text-stroke: 0.6px var(--outline-dark);
      paint-order: stroke fill;
    }

    .status-idle {
      --accent: #94a3b8;
      --accent-soft: rgba(148, 163, 184, 0.23);
      --accent-ring: rgba(148, 163, 184, 0.25);
      --accent-glow: rgba(148, 163, 184, 0.6);
    }

    .status-listening {
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.22);
      --accent-ring: rgba(96, 165, 250, 0.24);
      --accent-glow: rgba(96, 165, 250, 0.58);
    }

    .status-thinking {
      --accent: #fbbf24;
      --accent-soft: rgba(251, 191, 36, 0.22);
      --accent-ring: rgba(251, 191, 36, 0.24);
      --accent-glow: rgba(251, 191, 36, 0.58);
    }

    .status-responding {
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.24);
      --accent-ring: rgba(52, 211, 153, 0.26);
      --accent-glow: rgba(52, 211, 153, 0.58);
    }

    .status-idle .status-text {
      color: #f1f5f9;
    }

    .status-listening .status-text {
      color: #dbeafe;
    }

    .status-thinking .status-text {
      color: #fef3c7;
    }

    .status-responding .status-text {
      color: #d1fae5;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.45;
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0.65);
        opacity: 0.68;
      }
      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 1366px) {
      #status-container {
        transform: scale(1.5);
        right: 20px;
        top: 20px;
      }
    }

    @media (max-width: 1100px) {
      #status-container {
        transform: scale(1.28);
      }
    }
  </style>
</head>
<body>
  <div id="status-container">
    <div class="status-card status-idle">
      <div class="status-header">
        <span class="status-icon">*</span>
        <span class="status-label">AI STATUS</span>
      </div>
      <div class="status-main">
        <span class="status-indicator"></span>
        <span class="status-text" id="status-text">Idle</span>
      </div>
      <div class="status-extra" id="status-extra">等待互动中...</div>
      <div class="status-metrics">
        <div class="metric">
          <span class="metric-label">情绪</span>
          <span class="metric-value" id="emotion">平静</span>
        </div>
        <div class="metric">
          <span class="metric-label">驱动</span>
          <span class="metric-value" id="drive">好奇 52%</span>
        </div>
        <div class="metric">
          <span class="metric-label">互动</span>
          <span class="metric-value" id="interaction">0</span>
        </div>
        <div class="metric">
          <span class="metric-label">记忆</span>
          <span class="metric-value" id="memory">0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DANMAKU_PORT = 4003;  // Danmaku bridge WebSocket port (fixed)
    const BRAINNN_PORT = 4007;
    const MEMORY_PORT = 4005;

    const statusConfig = {
      idle: { icon: "*", text: "Idle", extra: "等待互动中...", className: "status-idle" },
      listening: { icon: "o", text: "Listening", extra: "正在倾听...", className: "status-listening" },
      thinking: { icon: "+", text: "Thinking", extra: "正在思考回复...", className: "status-thinking" },
      responding: { icon: ">", text: "Responding", extra: "正在回复...", className: "status-responding" }
    };

    const emotionMap = {
      joy: "喜悦",
      sadness: "悲伤",
      anger: "愤怒",
      fear: "恐惧",
      surprise: "惊讶",
      disgust: "厌恶",
      trust: "信任",
      anticipation: "期待"
    };

    const driveMap = {
      boredom: "无聊",
      curiosity: "好奇",
      fatigue: "疲劳",
      social_need: "社交"
    };

    let ws = null;
    let currentStatus = "idle";
    let idleTimer = null;
    let thinkingTimer = null;
    let respondingTimer = null;
    let reconnectTimer = null;

    const cardEl = document.querySelector(".status-card");
    const iconEl = document.querySelector(".status-icon");
    const textEl = document.getElementById("status-text");
    const extraEl = document.getElementById("status-extra");
    const emotionEl = document.getElementById("emotion");
    const driveEl = document.getElementById("drive");
    const interactionEl = document.getElementById("interaction");
    const memoryEl = document.getElementById("memory");

    function setStatus(status, customExtra = null) {
      const config = statusConfig[status] || statusConfig.idle;
      if (currentStatus === status && !customExtra) {
        return;
      }

      currentStatus = status;
      cardEl.className = `status-card ${config.className}`;
      iconEl.textContent = config.icon;
      textEl.textContent = config.text;
      extraEl.textContent = customExtra || config.extra;
    }

    async function fetchJsonWithTimeout(url, timeoutMs = 1800) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return await response.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    async function updateBrainNNStatus() {
      try {
        const data = await fetchJsonWithTimeout(`http://127.0.0.1:${BRAINNN_PORT}/state`);
        const soul = data?.soul_state;
        if (!soul) {
          return;
        }

        if (soul.emotion && typeof soul.emotion === "object") {
          const topEmotion = Object.entries(soul.emotion).sort((a, b) => Number(b[1]) - Number(a[1]))[0];
          if (topEmotion) {
            const [key, raw] = topEmotion;
            const percent = Math.round(Number(raw) * 100);
            emotionEl.textContent = `${emotionMap[key] || key} ${Number.isFinite(percent) ? percent : 0}%`;
          }
        }

        if (soul.drives && typeof soul.drives === "object") {
          const topDrive = Object.entries(soul.drives).sort((a, b) => Number(b[1]) - Number(a[1]))[0];
          if (topDrive) {
            const [key, raw] = topDrive;
            const percent = Math.round(Number(raw) * 100);
            driveEl.textContent = `${driveMap[key] || key} ${Number.isFinite(percent) ? percent : 0}%`;
          }
        }

        if (typeof soul.interaction_count === "number") {
          interactionEl.textContent = String(soul.interaction_count);
        }
      } catch (err) {
        console.warn("[ai-status] Failed to fetch BrainNN state:", err.message);
      }
    }

    async function updateMemoryStatus() {
      try {
        const data = await fetchJsonWithTimeout(`http://127.0.0.1:${MEMORY_PORT}/state`);
        if (typeof data?.total_memories === "number") {
          memoryEl.textContent = String(data.total_memories);
        }
      } catch (err) {
        console.warn("[ai-status] Failed to fetch memory state:", err.message);
      }
    }

    function clearWorkflowTimers() {
      clearTimeout(thinkingTimer);
      clearTimeout(respondingTimer);
      thinkingTimer = null;
      respondingTimer = null;
    }

    function startIdleTimer(delayMs = 30000) {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => setStatus("idle"), delayMs);
    }

    function handleDanmakuEvent(payload) {
      clearWorkflowTimers();
      clearTimeout(idleTimer);

      const user = String(payload?.username || payload?.userId || "观众").trim() || "观众";
      setStatus("listening", `收到 ${user} 的消息`);

      thinkingTimer = setTimeout(() => {
        setStatus("thinking");
      }, 900);

      respondingTimer = setTimeout(() => {
        setStatus("responding");
        updateBrainNNStatus();
        startIdleTimer(6000 + Math.round(Math.random() * 3000));
      }, 2400);
    }

    function connectWebSocket() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      const wsUrl = `ws://127.0.0.1:${DANMAKU_PORT}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("[ai-status] websocket connected:", wsUrl);
        setStatus("idle", "连接成功，等待互动...");
        startIdleTimer(12000);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleDanmakuEvent(data);
        } catch (err) {
          console.warn("[ai-status] Failed to parse websocket payload:", err.message);
        }
      };

      ws.onerror = (err) => {
        console.warn("[ai-status] websocket error:", err?.message || err);
      };

      ws.onclose = () => {
        setStatus("idle", "连接断开，正在重连...");
        reconnectTimer = setTimeout(connectWebSocket, 5000);
      };
    }

    connectWebSocket();
    updateBrainNNStatus();
    updateMemoryStatus();
    setInterval(updateBrainNNStatus, 5000);
    setInterval(updateMemoryStatus, 10000);
    startIdleTimer();
  </script>
</body>
</html>
