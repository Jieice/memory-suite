[server]
host = "127.0.0.1"
port = 8080

[storage]
database_path = "./runtime/memory-suite.db"
data_root = "./runtime"

[python]
executable = "python"
models_root = "./python"

[features]
enable_mock_tts = true

[tts]
provider = "edge_tts"
endpoint = "http://127.0.0.1:9881"
health_path = "/voices"
chat_voice = "zh-CN-XiaoxiaoNeural"
speech_rate = "1.2"

[stt]
provider = "faster-whisper"
endpoint = "http://127.0.0.1:9882/transcribe"
model = "small"
language = "zh"
prompt = ""

[llm]
provider = "openai-compatible"
endpoint = "https://new-api-production-a2c1.up.railway.app/v1/chat/completions"
model = "z-ai/glm-5.2"
api_key = "sk-cN2psyZzxRlnaNn8Z2edjUp97BfZ8hAg1j1wIPjuMibvTXsr"
system_prompt = "你是 Memory Suite 直播运行时助手。默认使用简体中文直接回复，保持自然、简洁、可执行，避免模板腔和自我介绍。"
remote_timeout_ms = 25000
fallback_timeout_ms = 12000
